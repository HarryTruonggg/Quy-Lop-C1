<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Nhập quỹ</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:#f0f4f8; padding:24px; color:#1e293b; }
  .container { max-width:640px; margin:0 auto; }
  .card { background:#fff; border-radius:16px; padding:20px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  h1 { text-align:center; margin-bottom:20px; }
  h2 { font-size:16px; margin-bottom:14px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:13px; color:#475569; margin-bottom:4px; }
  .field input, .field select { width:100%; padding:9px 10px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; }
  .field input[type=file] { padding:8px; background:#f8fafc; }
  button { padding:10px 18px; border:none; border-radius:8px; background:#2563eb; color:#fff;
    font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  button:disabled { background:#94a3b8; cursor:wait; }
  #status { margin-top:12px; font-size:14px; font-weight:600; }
  .ok { color:#059669; } .err { color:#dc2626; }
  .warn { background:#fef3c7; border:1px solid #f59e0b; border-radius:8px; padding:10px; font-size:13px; margin-bottom:16px; }
  .hint { font-size:12px; color:#94a3b8; margin-top:4px; }
  .recent { font-size:13px; color:#64748b; margin-top:12px; line-height:1.7; }
  .type-thu { color:#059669; font-weight:600; }
  .type-chi { color:#d97706; font-weight:600; }
</style>
</head>
<body>
<div class="container">
  <h1>🔐 Admin - Nhập quỹ</h1>
  <div class="warn">⚠️ Token chỉ lưu trên trình duyệt của bạn. Không chia sẻ trang này kèm token cho ai.</div>

  <div class="card">
    <h2>1. Kết nối GitHub</h2>
    <div class="field"><label>GitHub username</label><input id="ghUser" placeholder="vd: harrytruonggg"></div>
    <div class="field"><label>Tên repo</label><input id="ghRepo" placeholder="vd: quy-lop-c1"></div>
    <div class="field"><label>Fine-grained token (quyền Contents: Read &amp; Write)</label>
      <input id="ghToken" type="password" placeholder="github_pat_..."></div>
    <button onclick="saveConfig()">💾 Lưu kết nối</button>
  </div>

  <div class="card">
    <h2>2. Thêm lượt thu / chi</h2>
    <div class="field">
      <label>Loại</label>
      <select id="type" onchange="onTypeChange()">
        <option value="thu">📥 Thu (đóng góp)</option>
        <option value="chi">📤 Chi (chi tiêu)</option>
      </select>
    </div>
    <div class="field"><label id="nameLabel">Tên thành viên</label>
      <input id="name" list="nameList" placeholder="VD: Minh Anh">
      <datalist id="nameList"></datalist></div>
    <div class="field"><label>Số tiền (₫)</label><input id="amount" type="number" min="1" step="1000" placeholder="100000"></div>
    <div class="field"><label>Ngày</label><input id="date" type="date"></div>
    <div class="field"><label>Ghi chú</label><input id="note" placeholder="VD: Quỹ tháng 9"></div>
    <div class="field" id="imgField" style="display:none">
      <label>📷 Ảnh nghiệm thu (hóa đơn, ảnh bàn giao...)</label>
      <input id="imgs" type="file" accept="image/*" multiple>
      <div class="hint">Chọn được nhiều ảnh. Ảnh sẽ tự nén còn tối đa 1200px trước khi tải lên repo.</div>
    </div>
    <button id="submitBtn" onclick="submitEntry()">➕ Thêm vào quỹ</button>
    <div id="status"></div>
    <div class="recent" id="recent"></div>
  </div>
</div>

<script>
const API = (u,r,p) => `https://${u}.github.io/${r}/${p}`;
const GH = path => `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${path}`;
let cfg = JSON.parse(localStorage.getItem('fund_admin_cfg') || '{}');

document.getElementById('ghUser').value  = cfg.user  || '';
document.getElementById('ghRepo').value  = cfg.repo  || '';
document.getElementById('ghToken').value = cfg.token || '';
document.getElementById('date').valueAsDate = new Date();

function onTypeChange() {
  const isChi = document.getElementById('type').value === 'chi';
  document.getElementById('imgField').style.display = isChi ? 'block' : 'none';
  document.getElementById('nameLabel').textContent = isChi ? 'Hạng mục chi / Người nhận' : 'Tên thành viên';
  document.getElementById('note').placeholder = isChi ? 'VD: Mua nước uống 20/11' : 'VD: Quỹ tháng 9';
}

function saveConfig() {
  cfg = {
    user:  document.getElementById('ghUser').value.trim(),
    repo:  document.getElementById('ghRepo').value.trim(),
    token: document.getElementById('ghToken').value.trim()
  };
  localStorage.setItem('fund_admin_cfg', JSON.stringify(cfg));
  setStatus('Đã lưu kết nối ✔', 'ok');
  loadRecent();
}

function authHeaders() {
  return { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' };
}

async function fetchEntries() {
  const res = await fetch(API(cfg.user, cfg.repo, 'data.json?t=' + Date.now()));
  if (!res.ok) throw new Error('Không đọc được data.json — kiểm tra repo/Pages');
  const data = await res.json();
  const meta = await fetch(GH('data.json'), { headers: authHeaders() });
  if (!meta.ok) throw new Error('Token sai hoặc thiếu quyền Contents');
  const { sha } = await meta.json();
  return { entries: data.entries || [], sha };
}

/* Nén ảnh về tối đa 1200px, JPEG 75% */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1200 / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

/* Upload 1 ảnh lên thư mục images/ của repo, trả về đường dẫn */
async function uploadImage(file, tag) {
  const b64 = await compressImage(file);
  const fname = `images/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
  const res = await fetch(GH(fname), {
    method: 'PUT',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: `Ảnh nghiệm thu ${tag}: ${file.name}`, content: b64 })
  });
  if (!res.ok) throw new Error(`Upload ảnh "${file.name}" thất bại: ${res.status}`);
  return fname;
}

async function submitEntry() {
  const name   = document.getElementById('name').value.trim();
  const amount = +document.getElementById('amount').value;
  const date   = document.getElementById('date').value;
  const note   = document.getElementById('note').value.trim();
  const type   = document.getElementById('type').value;
  const files  = [...document.getElementById('imgs').files];
  if (!name || !amount || !date) return setStatus('Thiếu thông tin!', 'err');
  if (!cfg.token) return setStatus('Chưa lưu kết nối GitHub!', 'err');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try {
    // Upload ảnh trước (nếu có)
    let imgs = [];
    for (let i = 0; i < files.length; i++) {
      setStatus(`📷 Đang tải ảnh ${i+1}/${files.length}...`, '');
      imgs.push(await uploadImage(files[i], name));
    }

    setStatus('💾 Đang lưu dữ liệu...', '');
    const { entries, sha } = await fetchEntries();
    entries.push({ id: Date.now(), name, amount, date, note, type, ...(imgs.length ? { imgs } : {}) });
    const res = await fetch(GH('data.json'), {
      method: 'PUT',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `${type === 'chi' ? 'Chi' : 'Thu'}: ${name} ${amount.toLocaleString('vi-VN')}đ (${date})`,
        content: btoa(unescape(encodeURIComponent(JSON.stringify({ entries }, null, 2)))),
        sha
      })
    });
    if (!res.ok) throw new Error('Ghi thất bại: ' + res.status);
    setStatus(`Đã thêm [${type.toUpperCase()}] ${name}: ${amount.toLocaleString('vi-VN')}đ ✔${imgs.length ? ` kèm ${imgs.length} ảnh` : ''} (trang public cập nhật sau ~1 phút)`, 'ok');
    document.getElementById('name').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('note').value = '';
    document.getElementById('imgs').value = '';
    loadRecent();
  } catch (e) {
    setStatus(e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

async function loadRecent() {
  if (!cfg.user || !cfg.repo) return;
  try {
    const res = await fetch(API(cfg.user, cfg.repo, 'data.json?t=' + Date.now()));
    const entries = (await res.json()).entries || [];
    const members = [...new Set(entries.filter(e => (e.type||'thu') === 'thu').map(e => e.name))];
    document.getElementById('nameList').innerHTML = members.map(m => `<option value="${m}">`).join('');
    const last5 = entries.slice(-5).reverse().map(e => {
      const t = e.type || 'thu';
      const cls = t === 'chi' ? 'type-chi' : 'type-thu';
      const sign = t === 'chi' ? '−' : '+';
      const cam = e.imgs && e.imgs.length ? ` 📷${e.imgs.length}` : '';
      return `${e.date} · <span class="${cls}">${sign}</span> ${e.name}: ${e.amount.toLocaleString('vi-VN')}đ${cam}`;
    }).join('<br>');
    document.getElementById('recent').innerHTML = last5 ? '<b>5 lượt gần nhất:</b><br>' + last5 : '';
  } catch {}
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

loadRecent();
</script>
</body>
</html>
